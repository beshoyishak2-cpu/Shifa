name: Import Saree3 brand assets

on:
  push:
    paths:
      - ".github/workflows/import-brand-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-brand-assets:
    name: Import Saree3 brand assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare brand directory
        run: mkdir -p public/brand

      - name: Download brand assets
        run: |
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "https://h.uguu.se/WukFhTSumZZx.png" -o public/brand/sari3-icon.png
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "https://h.uguu.se/hnbhLNXQBcCX.png" -o public/brand/sari3-lockup-white.png
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "https://h.uguu.se/MWeMtBbfhBHD.png" -o public/brand/sari3-lockup-green.png

      - name: Verify PNG files
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("public/brand/sari3-icon.png"),
              Path("public/brand/sari3-lockup-white.png"),
              Path("public/brand/sari3-lockup-green.png"),
          ]
          signature = bytes((0x89, 0x50, 0x4E, 0x47))
          for path in files:
              data = path.read_bytes()
              if not data.startswith(signature):
                  raise SystemExit(f"Invalid PNG signature: {path}")
              if len(data) <= 100_000:
                  raise SystemExit(f"File is too small: {path} ({len(data)} bytes)")
              print(f"Verified {path}: {len(data)} bytes")
          PY

      - name: Commit and push brand assets
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/brand/sari3-icon.png public/brand/sari3-lockup-white.png public/brand/sari3-lockup-green.png
          if git diff --cached --quiet; then
            echo "Brand assets are already up to date."
            exit 0
          fi
          git commit -m "Add approved Saree3 brand assets"
          git push origin "HEAD:${GITHUB_REF_NAME}"
