name: Saree3 Android build
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Shifa-MVP-Project(2).zip'
      - 'app-overlay/**'
      - 'supabase/migrations/**'
      - 'capacitor.config.ts'
      - 'index.html'
      - '.github/workflows/mobile-build.yml'
jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract app source archive
        run: |
          mkdir -p /tmp/shifa-src
          unzip -q 'Shifa-MVP-Project(2).zip' -d /tmp/shifa-src
          test -f /tmp/shifa-src/Shifa/package.json
          cp -a /tmp/shifa-src/Shifa/. .
          python3 app-overlay/patch-branding.py
          python3 app-overlay/patch-ui.py
          cp app-overlay/LocationSystem.tsx src/LocationSystem.tsx
          SAREE_PREPARE_PATCH=1 python3 app-overlay/patch-location.py
          python3 -c "import base64,gzip,pathlib; pathlib.Path('/tmp/patch-live-backend.py').write_bytes(gzip.decompress(base64.b64decode(pathlib.Path('app-overlay/patch-live-backend.py.gz.b64').read_text())))"
          python3 /tmp/patch-live-backend.py
          cat app-overlay/patch-extra-services.part1.b64 app-overlay/patch-extra-services.part2.b64 app-overlay/patch-extra-services.part3a.b64 app-overlay/patch-extra-services.part3b.b64 app-overlay/patch-extra-services.part3c.b64 app-overlay/patch-extra-services.part3d.b64 app-overlay/patch-extra-services.part4.b64 app-overlay/patch-extra-services.part5.b64 > /tmp/patch-extra-services.b64
          python3 -c "import base64,gzip,pathlib,hashlib; b=pathlib.Path('/tmp/patch-extra-services.b64').read_bytes(); assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\\0'+b).hexdigest()=='36c0fcf5ffe21301a17b9a3ee70be00377e3c42c'; pathlib.Path('/tmp/patch-extra-services.py').write_bytes(gzip.decompress(base64.b64decode(b)))"
          python3 /tmp/patch-extra-services.py
          python3 app-overlay/patch-final-fixes.py
          cat app-overlay/patch-admin-console.part1.b64 app-overlay/patch-admin-console.part2.b64 app-overlay/patch-admin-console.part3.b64 app-overlay/patch-admin-console.part4.b64 > /tmp/patch-admin-console.b64
          python3 -c "import base64,gzip,pathlib,hashlib; b=pathlib.Path('/tmp/patch-admin-console.b64').read_bytes(); assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\\0'+b).hexdigest()=='636b09ec0edf1f8939a40dc7465862795dc27f62'; pathlib.Path('/tmp/patch-admin-console.py').write_bytes(gzip.decompress(base64.b64decode(b)))"
          python3 /tmp/patch-admin-console.py
          python3 app-overlay/patch-auth.py
          python3 app-overlay/patch-auth-refresh.py
          python3 app-overlay/patch-saree-ops.py
          python3 app-overlay/patch-support.py
          python3 app-overlay/patch-back-navigation.py
          python3 app-overlay/patch-customer-catalog.py
          python3 -c "import base64,gzip,pathlib; pathlib.Path('/tmp/patch-product-options.py').write_bytes(gzip.decompress(base64.b64decode(pathlib.Path('app-overlay/patch-product-options.py.gz.b64').read_text())))"
          python3 /tmp/patch-product-options.py
          python3 app-overlay/patch-merchant-operations.py
          cp app-overlay/PrivateTripMap.tsx src/PrivateTripMap.tsx
          python3 app-overlay/patch-private-trip-map.py
          python3 app-overlay/patch-mobile-bottom-nav.py
          python3 app-overlay/patch-polish.py
          SAREE_FINAL_PATCH=1 python3 app-overlay/patch-location.py # finalize courier address handoff
          python3 app-overlay/patch-web-customer-fixes.py
          python3 app-overlay/patch-city-spelling.py
          python3 app-overlay/patch-brand-logo.py
          python3 app-overlay/patch-experience-and-issue-log.py
          python3 -c "import base64,gzip,pathlib; pathlib.Path('/tmp/patch-demo-mode.py').write_bytes(gzip.decompress(base64.b64decode(pathlib.Path('app-overlay/patch-demo-mode.py.gz.b64').read_text())))"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/patch-demo-mode.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('header_anchor = "</header><SareeSplash/><LocationSystem/>"','header_anchor = "</header>"')
          s=s.replace("role_switcher = r'''</header>{!backendReady", "role_switcher = r'''{!backendReady")
          s=s.replace("</section>}<SareeSplash/><LocationSystem/>'''", "</section>}'''")
          s=s.replace('s = s.replace(header_anchor,role_switcher,1)','s = s.replace(header_anchor,header_anchor+role_switcher,1)')
          p.write_text(s,encoding='utf-8')
          PY
          python3 /tmp/patch-demo-mode.py
          python3 app-overlay/patch-demo-order-flow.py
      - name: Preserve patched source for integration review
        uses: actions/upload-artifact@v4
        with:
          name: saree3-patched-source
          path: |
            src/App.tsx
            src/style.css
            src/LocationSystem.tsx
            tests/source-smoke.test.cjs
          if-no-files-found: error
      - name: Upgrade Capacitor to Google Play API 36 compatible version
        run: |
          npm pkg set "dependencies.@capacitor/core=^8.0.0"
          npm pkg set "dependencies.@capacitor/android=^8.0.0"
          npm pkg set "dependencies.@capacitor/ios=^8.0.0"
          npm pkg set "dependencies.@capacitor/app=^8.0.0"
          npm pkg set "dependencies.@capacitor/camera=^8.0.0"
          npm pkg set "dependencies.@capacitor/geolocation=^8.0.0"
          npm pkg set "dependencies.@capacitor/haptics=^8.0.0"
          npm pkg set "dependencies.@capacitor/push-notifications=^8.0.0"
          npm pkg set "dependencies.@capacitor/share=^8.0.0"
          npm pkg set "dependencies.@capacitor/splash-screen=^8.0.0"
          npm pkg set "dependencies.@capacitor/status-bar=^8.0.0"
          npm pkg set "devDependencies.@capacitor/cli=^8.0.0"
          node -e "const p=require('./package.json'); for (const [k,v] of Object.entries(p.dependencies||{})) if(k.startsWith('@capacitor/')) { if(!v.startsWith('^8.')) throw new Error(k+' is not on Capacitor 8'); }"
      - name: Configure Supabase client for app build
        run: |
          cat > .env.production <<'EOF'
          VITE_SUPABASE_URL=https://qfweejmqooojsedsypen.supabase.co
          VITE_SUPABASE_ANON_KEY=sb_publishable_a8Ys0LNdf7UcT6c6lH1KOg_gkXb0X_i
          VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_a8Ys0LNdf7UcT6c6lH1KOg_gkXb0X_i
          EOF
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm install --no-audit --no-fund --save-dev @types/react @types/react-dom
      - run: npm run build
      - name: Verify city spelling in web bundle
        run: |
          if grep -R -n 'ملوي' dist; then echo 'Incorrect city spelling remains in dist'; exit 1; fi
      - name: Verify approved brand assets in web bundle
        run: |
          test -s dist/brand/sari3-icon.png
          test -s dist/brand/sari3-lockup-white.png
          test -s dist/brand/sari3-lockup-green.png
      - name: Configure Capacitor Android
        run: |
          rm -f capacitor.config.ts capacitor.config.js capacitor.config.mjs
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.shifa.mallawi",
            "appName": "سريع",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF
      - run: npx cap add android
      - name: Install Pillow and generate native brand assets
        run: |
          python3 -m venv /tmp/saree-brand-venv
          /tmp/saree-brand-venv/bin/python -m pip install Pillow
          /tmp/saree-brand-venv/bin/python app-overlay/generate-brand-icons.py
          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            test -s "android/app/src/main/res/mipmap-$density/ic_launcher_foreground.png"
          done
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/values/ic_launcher_background.xml
          test -f android/app/src/main/res/drawable/splash.png
      - run: python3 app-overlay/patch-android-location-permissions.py
      - run: npx cap sync android
      - name: Set unique Google Play version
        env:
          APP_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          s, count = re.subn(r"versionCode\s+\d+", "versionCode " + os.environ["APP_BUILD_NUMBER"], s, count=1)
          if count != 1:
              raise SystemExit("Could not set Android versionCode")
          s, count = re.subn(r'versionName\s+"[^"]+"', 'versionName "1.0.' + os.environ["APP_BUILD_NUMBER"] + '"', s, count=1)
          if count != 1:
              raise SystemExit("Could not set Android versionName")
          p.write_text(s)
          PY
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: shifa-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish public debug APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: saree-debug-${{ github.run_number }}
          name: Saree debug APK #${{ github.run_number }}
          body: |
            Automated debug APK build for testing. This is not a store release.
          prerelease: true
          draft: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check Android signing secrets
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/saree3-release.keystore"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Android Release skipped: add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD repository secrets."
          fi
      - name: Build signed Android release APK
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/saree3-release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      - name: Upload signed Android release APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shifa-android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Upload signed Google Play Android App Bundle
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shifa-google-play-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
