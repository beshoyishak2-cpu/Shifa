name: Saree3 Android build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Shifa-MVP-Project(2).zip'
      - 'app-overlay/**'
      - 'supabase/migrations/**'
      - 'capacitor.config.ts'
      - '.github/workflows/mobile-build.yml'
jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract app source archive
        run: |
          mkdir -p /tmp/shifa-src
          unzip -q 'Shifa-MVP-Project(2).zip' -d /tmp/shifa-src
          test -f /tmp/shifa-src/Shifa/package.json
          cp -a /tmp/shifa-src/Shifa/. .
          python3 app-overlay/patch-ui.py
          cp app-overlay/LocationSystem.tsx src/LocationSystem.tsx
          python3 app-overlay/patch-location.py
          python3 -c "import base64,gzip,pathlib; pathlib.Path('/tmp/patch-live-backend.py').write_bytes(gzip.decompress(base64.b64decode(pathlib.Path('app-overlay/patch-live-backend.py.gz.b64').read_text())))"
          python3 /tmp/patch-live-backend.py
          cat app-overlay/patch-extra-services.part1.b64 app-overlay/patch-extra-services.part2.b64 app-overlay/patch-extra-services.part3a.b64 app-overlay/patch-extra-services.part3b.b64 app-overlay/patch-extra-services.part3c.b64 app-overlay/patch-extra-services.part3d.b64 app-overlay/patch-extra-services.part4.b64 app-overlay/patch-extra-services.part5.b64 > /tmp/patch-extra-services.b64
          python3 -c "import base64,gzip,pathlib,hashlib; b=pathlib.Path('/tmp/patch-extra-services.b64').read_bytes(); assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\\0'+b).hexdigest()=='36c0fcf5ffe21301a17b9a3ee70be00377e3c42c'; pathlib.Path('/tmp/patch-extra-services.py').write_bytes(gzip.decompress(base64.b64decode(b)))"
          python3 /tmp/patch-extra-services.py
          python3 app-overlay/patch-final-fixes.py
          cat app-overlay/patch-admin-console.part1.b64 app-overlay/patch-admin-console.part2.b64 app-overlay/patch-admin-console.part3.b64 app-overlay/patch-admin-console.part4.b64 > /tmp/patch-admin-console.b64
          python3 -c "import base64,gzip,pathlib,hashlib; b=pathlib.Path('/tmp/patch-admin-console.b64').read_bytes(); assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\\0'+b).hexdigest()=='636b09ec0edf1f8939a40dc7465862795dc27f62'; pathlib.Path('/tmp/patch-admin-console.py').write_bytes(gzip.decompress(base64.b64decode(b)))"
          python3 /tmp/patch-admin-console.py
          python3 app-overlay/patch-auth.py
          python3 app-overlay/patch-auth-refresh.py
          python3 app-overlay/patch-saree-ops.py
          python3 app-overlay/patch-back-navigation.py
      - name: Preserve patched source for integration review
        uses: actions/upload-artifact@v4
        with:
          name: saree3-patched-source
          path: |
            src/App.tsx
            src/style.css
            src/LocationSystem.tsx
            tests/source-smoke.test.cjs
          if-no-files-found: error
      - name: Configure Supabase client for app build
        run: |
          cat > .env.production <<'EOF'
          VITE_SUPABASE_URL=https://qfweejmqooojsedsypen.supabase.co
          VITE_SUPABASE_ANON_KEY=sb_publishable_a8Ys0LNdf7UcT6c6lH1KOg_gkXb0X_i
          VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_a8Ys0LNdf7UcT6c6lH1KOg_gkXb0X_i
          EOF
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm install --no-audit --no-fund --save-dev @types/react @types/react-dom
      - run: npm run build
      - name: Configure Capacitor Android
        run: |
          rm -f capacitor.config.ts capacitor.config.js capacitor.config.mjs
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.shifa.mallawi",
            "appName": "سريع",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF
      - run: npx cap add android
      - run: npx cap sync android
      - name: Set unique Google Play version
        env:
          APP_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          s, count = re.subn(r"versionCode\\s+\\d+", "versionCode " + os.environ["APP_BUILD_NUMBER"], s, count=1)
          if count != 1:
              raise SystemExit("Could not set Android versionCode")
          s, count = re.subn(r'versionName\s+"[^"]+"', 'versionName "1.0.' + os.environ["APP_BUILD_NUMBER"] + '"', s, count=1)
          if count != 1:
              raise SystemExit("Could not set Android versionName")
          p.write_text(s)
          PY
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: shifa-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Check Android signing secrets
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/saree3-release.keystore"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Android Release skipped: add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD repository secrets."
          fi
      - name: Build signed Android release APK
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/saree3-release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      - name: Upload signed Android release APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shifa-android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Upload signed Google Play Android App Bundle
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shifa-google-play-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
